org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Pub cache lives on C: while the project is on D:. Kotlin's relocatable
# incremental caches call File.relativeTo(), which throws across Windows
# drive roots, so incremental Kotlin compilation must stay off here.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
