name: expensebeam_mobile
description: "ExpenseBeam - Personal Finance Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.69.0

  # Speech recognition
  speech_to_text: ^7.0.0

  # UI Utilities
  intl: ^0.19.0
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.4

  # Business model
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Regenerate launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  # Android 8+ masks the icon itself. Without an adaptive icon the launcher
  # letterboxes the legacy one onto a white shape, so supply the artwork as a
  # foreground over its own navy instead.
  adaptive_icon_background: "#0B1445"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 18
  ios: true
  # App Store rejects icons with alpha; the source has transparent corners,
  # so they get flattened onto the artwork's own navy rather than white.
  remove_alpha_ios: true
  background_color_ios: "#0B1445"

flutter:
  uses-material-design: true
